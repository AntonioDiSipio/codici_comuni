name: Auto Update Belfiore Codes

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Esegui script di aggiornamento
        run: python update_belfiore.py

      - name: Aggiorna timestamp nel README
        run: |
          sed -i '/_Ultimo controllo automatico/d' README.md
          echo -e "\n_Ultimo controllo automatico: $(date +'%Y-%m-%d %H:%M:%S UTC')_" >> README.md

      - name: Committa e spingi le modifiche
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md comuni_belfiore.json comuni_belfiore.csv
          git diff --staged --quiet || (git commit -m "bot: sincronizzazione dati Belfiore/ISTAT [$(date +'%Y-%m-%d')]" && git push)
