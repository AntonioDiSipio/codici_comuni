name: Auto Update Belfiore Codes

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout codice
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Esegui script di aggiornamento
        run: python update_belfiore.py

      - name: Committa e spingi le modifiche se presenti
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add comuni_belfiore.json comuni_belfiore.csv
          git diff --staged --quiet || (git commit -m "bot: aggiornamento automatico dati Belfiore/ISTAT" && git push)
